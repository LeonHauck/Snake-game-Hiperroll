<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hiper Roll Snake</title>
<link rel="icon" type="image/png" href="assets/Novo-Logotipo-HiperRoll.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="brand-logo" src="assets/Novo-Logotipo-HiperRoll.png" alt="Hiper Roll" onerror="this.style.display='none'">
      <h1>SNAKE</h1>
    </header>

    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Pontos</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Recorde</span>
        <span class="hud-value" id="highscore">0</span>
      </div>
      <button class="mute-btn" id="muteBtn" aria-label="Ativar ou desativar som">🔊</button>
    </div>

    <div class="game-area">
      <div class="board-column">
        <div class="board-wrap">
          <canvas id="board" width="520" height="520"></canvas>

          <div class="overlay" id="startOverlay">
            <img class="overlay-logo" src="assets/Novo-Logotipo-HiperRoll.png" alt="Hiper Roll" onerror="this.style.display='none'">
            <h2>Snake Hiper Roll</h2>
            <p>Use as setas ou arraste o dedo para mover.<br>Coma as logos e cresça!</p>
            <input type="text" id="playerName" maxlength="10" placeholder="Seu nome (até 10 letras)" autocomplete="off">
            <button id="startBtn">Jogar</button>
          </div>

          <div class="overlay hidden" id="gameOverOverlay">
            <h2>Fim de jogo</h2>
            <p id="finalScore">Você fez 0 pontos</p>
            <p class="rank-note hidden" id="rankNote"></p>
            <button id="restartBtn">Jogar novamente</button>
          </div>

          <div class="overlay hidden" id="pauseOverlay">
            <h2>Pausado</h2>
            <p>Pressione espaço para continuar</p>
          </div>
        </div>

        <div class="touch-controls" id="touchControls">
          <button data-dir="up" aria-label="Cima">▲</button>
          <div class="touch-row">
            <button data-dir="left" aria-label="Esquerda">◀</button>
            <button data-dir="down" aria-label="Baixo">▼</button>
            <button data-dir="right" aria-label="Direita">▶</button>
          </div>
        </div>

        <footer class="footer">HiperRoll Embalagens</footer>
      </div>

      <aside class="leaderboard">
        <h3>🏆 Top 5</h3>
        <ol id="leaderboardList" class="leaderboard-list">
          <li class="leaderboard-empty">Carregando...</li>
        </ol>
      </aside>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
